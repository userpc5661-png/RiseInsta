# .github/workflows/build.yml — builds RiseInsta.dylib + .deb on every push.
name: Build dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid make xz dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Collect output
        run: |
          mkdir -p out
          cp packages/*.deb out/ 2>/dev/null || true
          find .theos/obj -name "RiseInsta.dylib" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RiseInsta
          path: out/*
